<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Leaderboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  color: #17324d;
  min-height: 100vh;
}


/* HEADER */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0;
  font-size: 40px;
  letter-spacing: 3px;
}

header h2 {
  margin: 8px 0 0;
  font-size: 21px;
}

header p {
  margin: 8px 0 0;
  opacity: .9;
}


/* CONTAINER */

.container {
  max-width: 750px;
  margin: auto;
  padding: 25px 15px;
}


/* TITLE */

.title-card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.trophy {
  font-size: 55px;
}

.title-card h2 {
  margin: 8px 0;
  color: #1557a6;
}

.title-card p {
  margin: 0;
  color: #718096;
}


/* STATUS */

.status {
  background: #e8f3ff;
  color: #174a7c;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  text-align: center;
  font-size: 14px;
}


/* LEADERBOARD */

.leaderboard {
  display: flex;
  flex-direction: column;
  gap: 12px;
}


/* NORMAL ROW */

.leader-row {
  background: white;
  border-radius: 15px;
  padding: 17px 20px;
  display: grid;
  grid-template-columns: 70px 1fr 100px;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 12px rgba(0,0,0,.07);
}


/* TOP THREE */

.rank-1 {
  border: 2px solid #f0c419;
  transform: scale(1.02);
}

.rank-2 {
  border: 2px solid #b0bec5;
}

.rank-3 {
  border: 2px solid #c98b5b;
}


/* RANK */

.rank {
  font-size: 21px;
  font-weight: bold;
  text-align: center;
}


/* NAME */

.student-name {
  font-size: 17px;
  font-weight: bold;
  text-transform: uppercase;
}


/* PERCENTAGE */

.percentage {
  font-size: 20px;
  font-weight: bold;
  color: #1976d2;
  text-align: right;
}


/* TOP STUDENT */

.rank-1 .student-name {
  font-size: 19px;
  color: #9a7000;
}

.rank-1 .percentage {
  font-size: 23px;
}


/* EMPTY */

.empty {
  background: white;
  border-radius: 15px;
  padding: 35px;
  text-align: center;
  color: #718096;
  box-shadow: 0 4px 12px rgba(0,0,0,.07);
}


/* BUTTONS */

.actions {
  text-align: center;
  margin-top: 25px;
}

.btn {
  display: inline-block;
  background: #1557a6;
  color: white;
  text-decoration: none;
  padding: 12px 22px;
  border-radius: 25px;
  margin: 5px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.btn:hover {
  background: #0d47a1;
}


/* FOOTER */

footer {
  text-align: center;
  padding: 25px;
  color: #718096;
  font-size: 13px;
  line-height: 1.6;
}


/* MOBILE */

@media(max-width:600px) {

  header h1 {
    font-size: 34px;
  }

  .leader-row {
    grid-template-columns: 55px 1fr 75px;
    padding: 15px 12px;
  }

  .student-name {
    font-size: 14px;
  }

  .percentage {
    font-size: 17px;
  }

}

</style>

</head>


<body>


<header>

  <h1>SEQS</h1>

  <h2>🏆 LEADERBOARD</h2>

  <p>
    Smart English Quiz System
  </p>

</header>


<div class="container">


  <div class="title-card">

    <div class="trophy">
      🏆
    </div>

    <h2>
      TOP 10 STUDENTS
    </h2>

    <p>
      Keep learning. Keep improving. Keep shining!
    </p>

  </div>


  <div
    class="status"
    id="statusMessage"
  >
    Loading leaderboard...
  </div>


  <div
    class="leaderboard"
    id="leaderboard"
  >

    <div class="empty">
      Loading Top 10...
    </div>

  </div>


  <div class="actions">

    <button
      type="button"
      class="btn"
      onclick="loadLeaderboard()"
    >
      REFRESH
    </button>

    <a
      href="index.html"
      class="btn"
    >
      BACK TO HOME
    </a>

  </div>


</div>


<footer>

  SEQS – Smart English Quiz System

  <br>

  English Year 3 | 2026

</footer>


<script>


/* =========================================
   SEQS GOOGLE APPS SCRIPT
========================================= */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzYMS62FFAqgmxOMSSCENvdHvFnjInHB8nHWQoStKsaFbkGrAlPsADr-Od2v8vkrC1L/exec";


/* =========================================
   LOAD LEADERBOARD
========================================= */

async function loadLeaderboard() {


  const status =
    document.getElementById(
      "statusMessage"
    );


  const leaderboard =
    document.getElementById(
      "leaderboard"
    );


  status.textContent =
    "Loading leaderboard...";


  try {


    const url =
      GOOGLE_SCRIPT_URL
      +
      "?action=leaderboard"
      +
      "&t="
      +
      Date.now();


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Unable to connect to SEQS."
      );

    }


    const data =
      await response.json();


    if (
      data.status === "error"
    ) {

      throw new Error(
        data.message ||
        "Leaderboard error."
      );

    }


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "Invalid leaderboard data."
      );

    }


    displayLeaderboard(
      data
    );


    status.textContent =
      "✓ Leaderboard updated successfully.";


  } catch (error) {


    console.error(
      "SEQS Leaderboard Error:",
      error
    );


    status.textContent =
      "Unable to load leaderboard.";


    leaderboard.innerHTML =
    `
      <div class="empty">
        Leaderboard is temporarily unavailable.
      </div>
    `;

  }

}


/* =========================================
   DISPLAY LEADERBOARD
========================================= */

function displayLeaderboard(data) {


  const leaderboard =
    document.getElementById(
      "leaderboard"
    );


  leaderboard.innerHTML =
    "";


  if (
    data.length === 0
  ) {


    leaderboard.innerHTML =
    `
      <div class="empty">

        No leaderboard records yet.

        <br><br>

        Complete a quiz to join the leaderboard!

      </div>
    `;


    return;

  }


  data.forEach(
    function(student) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "leader-row";


      if (
        student.rank === 1
      ) {

        row.classList.add(
          "rank-1"
        );

      }


      if (
        student.rank === 2
      ) {

        row.classList.add(
          "rank-2"
        );

      }


      if (
        student.rank === 3
      ) {

        row.classList.add(
          "rank-3"
        );

      }


      let rankDisplay =
        "#" + student.rank;


      if (
        student.rank === 1
      ) {

        rankDisplay =
          "🥇 1";

      }


      else if (
        student.rank === 2
      ) {

        rankDisplay =
          "🥈 2";

      }


      else if (
        student.rank === 3
      ) {

        rankDisplay =
          "🥉 3";

      }


      row.innerHTML =
      `

        <div class="rank">

          ${rankDisplay}

        </div>


        <div class="student-name">

          ${escapeHTML(
            student.name
          )}

        </div>


        <div class="percentage">

          ${escapeHTML(
            student.percentage
          )}

        </div>

      `;


      leaderboard.appendChild(
        row
      );

    }
  );

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(value) {


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   START
========================================= */

loadLeaderboard();


</script>


</body>

</html>
