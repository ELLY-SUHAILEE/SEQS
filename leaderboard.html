<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Leaderboard</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #eef6ff;
  color: #17324d;
  min-height: 100vh;
}


/* HEADER */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0;
  font-size: 42px;
  letter-spacing: 4px;
}

header h2 {
  margin: 8px 0 0;
  font-size: 22px;
}

header p {
  margin: 8px 0 0;
}


/* MAIN */

.container {
  max-width: 760px;
  margin: auto;
  padding: 25px 15px;
}


/* TITLE */

.title-card {
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.trophy {
  font-size: 55px;
}

.title-card h2 {
  margin: 8px 0;
  color: #1557a6;
  font-size: 28px;
}

.title-card p {
  margin: 0;
  color: #718096;
}


/* STATUS */

.status {
  background: #e1efff;
  color: #174a7c;
  text-align: center;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 18px;
}


/* LEADERBOARD */

.leaderboard {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.leader-row {
  background: white;
  border-radius: 15px;
  padding: 18px 20px;

  display: grid;
  grid-template-columns: 80px 1fr 100px;
  align-items: center;

  box-shadow: 0 4px 12px rgba(0,0,0,.07);
}


/* TOP 3 */

.rank-1 {
  border: 3px solid #f0c419;
  transform: scale(1.02);
}

.rank-2 {
  border: 2px solid #b0bec5;
}

.rank-3 {
  border: 2px solid #c98b5b;
}


/* CONTENT */

.rank {
  font-size: 21px;
  font-weight: bold;
  text-align: center;
}

.student-name {
  font-size: 18px;
  font-weight: bold;
  text-transform: uppercase;
}

.percentage {
  font-size: 21px;
  font-weight: bold;
  color: #1976d2;
  text-align: right;
}

.rank-1 .student-name {
  color: #9a7000;
  font-size: 20px;
}

.rank-1 .percentage {
  font-size: 24px;
}


/* EMPTY */

.empty {
  background: white;
  padding: 35px 20px;
  border-radius: 15px;
  text-align: center;
  color: #718096;
  box-shadow: 0 4px 12px rgba(0,0,0,.07);
}


/* BUTTONS */

.actions {
  text-align: center;
  margin-top: 25px;
}

.btn {
  display: inline-block;
  background: #1557a6;
  color: white;
  text-decoration: none;
  border: none;
  padding: 13px 23px;
  margin: 5px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: bold;
}

.btn:hover {
  background: #0d47a1;
}


/* FOOTER */

footer {
  text-align: center;
  color: #718096;
  padding: 25px;
  font-size: 13px;
  line-height: 1.6;
}


/* MOBILE */

@media (max-width:600px) {

  header h1 {
    font-size: 34px;
  }

  .leader-row {
    grid-template-columns: 60px 1fr 80px;
    padding: 15px 12px;
  }

  .student-name {
    font-size: 14px;
  }

  .percentage {
    font-size: 17px;
  }

}

</style>

</head>


<body>


<header>

  <h1>SEQS</h1>

  <h2>
    🏆 LEADERBOARD
  </h2>

  <p>
    Smart English Quiz System
  </p>

</header>



<main class="container">


  <div class="title-card">

    <div class="trophy">
      🏆
    </div>

    <h2>
      TOP 10 STUDENTS
    </h2>

    <p>
      Keep learning. Keep improving. Keep shining!
    </p>

  </div>



  <div
    class="status"
    id="statusMessage"
  >
    Loading leaderboard...
  </div>



  <div
    class="leaderboard"
    id="leaderboard"
  >

    <div class="empty">
      Loading Top 10...
    </div>

  </div>



  <div class="actions">

    <button
      type="button"
      class="btn"
      onclick="loadLeaderboard()"
    >
      REFRESH
    </button>


    <a
      href="index.html"
      class="btn"
    >
      BACK TO HOME
    </a>

  </div>


</main>



<footer>

  SEQS – Smart English Quiz System

  <br>

  English Year 3 | 2026

</footer>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT URL
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzYMS62FFAqgmxOMSSCENvdHvFnjInHB8nHWQoStKsaFbkGrAlPsADr-Od2v8vkrC1L/exec";


/* =====================================================
   JSONP CALLBACK
===================================================== */

function showLeaderboard(data) {

  const status =
    document.getElementById(
      "statusMessage"
    );

  const leaderboard =
    document.getElementById(
      "leaderboard"
    );


  /* REMOVE OLD JSONP SCRIPT */

  const oldScript =
    document.getElementById(
      "seqsLeaderboardScript"
    );

  if (oldScript) {
    oldScript.remove();
  }


  /* CHECK DATA */

  if (!Array.isArray(data)) {

    status.textContent =
      "Unable to load leaderboard.";

    leaderboard.innerHTML =
      `
        <div class="empty">
          Leaderboard is temporarily unavailable.
        </div>
      `;

    return;
  }


  /* DISPLAY */

  displayLeaderboard(data);


  status.textContent =
    "✓ Leaderboard updated successfully.";
}


/* =====================================================
   LOAD LEADERBOARD USING JSONP
===================================================== */

function loadLeaderboard() {

  const status =
    document.getElementById(
      "statusMessage"
    );

  const leaderboard =
    document.getElementById(
      "leaderboard"
    );


  status.textContent =
    "Loading leaderboard...";


  leaderboard.innerHTML =
    `
      <div class="empty">
        Loading Top 10...
      </div>
    `;


  /* REMOVE PREVIOUS SCRIPT */

  const previous =
    document.getElementById(
      "seqsLeaderboardScript"
    );

  if (previous) {
    previous.remove();
  }


  /* CREATE JSONP SCRIPT */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    "seqsLeaderboardScript";


  script.src =
    GOOGLE_SCRIPT_URL
    +
    "?action=leaderboard"
    +
    "&callback=showLeaderboard"
    +
    "&t="
    +
    Date.now();


  /* ERROR HANDLING */

  script.onerror =
    function() {

      status.textContent =
        "Unable to load leaderboard.";

      leaderboard.innerHTML =
        `
          <div class="empty">

            Leaderboard is temporarily unavailable.

            <br><br>

            Please try again.

          </div>
        `;

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   DISPLAY LEADERBOARD
===================================================== */

function displayLeaderboard(data) {

  const leaderboard =
    document.getElementById(
      "leaderboard"
    );


  leaderboard.innerHTML =
    "";


  if (data.length === 0) {

    leaderboard.innerHTML =
      `
        <div class="empty">

          No leaderboard records yet.

          <br><br>

          Complete a quiz to join the leaderboard!

        </div>
      `;

    return;
  }


  data.forEach(
    function(student) {


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "leader-row";


      const rank =
        Number(
          student.rank
        );


      /* TOP 3 DESIGN */

      if (rank === 1) {

        row.classList.add(
          "rank-1"
        );

      }

      else if (rank === 2) {

        row.classList.add(
          "rank-2"
        );

      }

      else if (rank === 3) {

        row.classList.add(
          "rank-3"
        );

      }


      /* RANK DISPLAY */

      let rankDisplay =
        "#" + rank;


      if (rank === 1) {

        rankDisplay =
          "🥇 1";

      }

      else if (rank === 2) {

        rankDisplay =
          "🥈 2";

      }

      else if (rank === 3) {

        rankDisplay =
          "🥉 3";

      }


      /* ROW */

      row.innerHTML =
        `

          <div class="rank">

            ${rankDisplay}

          </div>


          <div class="student-name">

            ${escapeHTML(
              student.name
            )}

          </div>


          <div class="percentage">

            ${escapeHTML(
              student.percentage
            )}

          </div>

        `;


      leaderboard.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value) {

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "DOMContentLoaded",
  loadLeaderboard
);


</script>


</body>

</html>
