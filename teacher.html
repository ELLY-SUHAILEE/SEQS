<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Teacher Record</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  color: #17324d;
}


/* HEADER */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 30px 15px;
}

header h1 {
  margin: 0;
  font-size: 38px;
  letter-spacing: 3px;
}

header h2 {
  margin: 7px 0 0;
  font-size: 18px;
  font-weight: normal;
}


/* CONTAINER */

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px 15px;
}


/* DASHBOARD */

.dashboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 22px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  text-align: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.card h3 {
  margin: 0 0 10px;
  color: #607080;
  font-size: 14px;
}

.number {
  font-size: 36px;
  font-weight: bold;
  color: #1976d2;
}


/* FILTER */

.filters {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.filters input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd8e5;
  border-radius: 9px;
  font-size: 15px;
}


/* STATUS */

.status {
  background: #e8f3ff;
  color: #174a7c;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 18px;
  text-align: center;
  font-size: 14px;
}


/* TABLE */

.table-box {
  background: white;
  border-radius: 15px;
  padding: 15px;
  overflow-x: auto;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 800px;
}

th {
  background: #1557a6;
  color: white;
  padding: 12px 10px;
  font-size: 14px;
}

td {
  padding: 11px 10px;
  border-bottom: 1px solid #e1e7ee;
  text-align: center;
  font-size: 14px;
}

tbody tr:hover {
  background: #f4f9ff;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #718096;
}


/* BUTTONS */

.actions {
  text-align: center;
  margin-top: 25px;
}

.btn {
  display: inline-block;
  background: #1557a6;
  color: white;
  text-decoration: none;
  padding: 11px 22px;
  border-radius: 25px;
  margin: 5px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.btn:hover {
  background: #0d47a1;
}


/* FOOTER */

footer {
  text-align: center;
  padding: 25px;
  color: #718096;
  font-size: 13px;
  line-height: 1.6;
}


/* MOBILE */

@media(max-width: 700px) {

  .dashboard {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header>

  <h1>SEQS</h1>

  <h2>
    TEACHER RECORD DASHBOARD
  </h2>

</header>


<div class="container">


  <!-- DASHBOARD CARDS -->

  <div class="dashboard">


    <div class="card">

      <h3>
        TOTAL ATTEMPTS
      </h3>

      <div
        class="number"
        id="totalAttempts"
      >
        0
      </div>

    </div>


    <div class="card">

      <h3>
        AVERAGE SCORE
      </h3>

      <div
        class="number"
        id="averageScore"
      >
        0%
      </div>

    </div>


    <div class="card">

      <h3>
        HIGHEST SCORE
      </h3>

      <div
        class="number"
        id="highestScore"
      >
        0%
      </div>

    </div>


  </div>


  <!-- STATUS -->

  <div
    class="status"
    id="statusMessage"
  >
    Connecting to SEQS Student Record...
  </div>


  <!-- SEARCH -->

  <div class="filters">

    <input
      type="text"
      id="searchBox"
      placeholder="Search by student name, class or module..."
      onkeyup="filterRecords()"
    >

  </div>


  <!-- TABLE -->

  <div class="table-box">


    <table id="recordTable">

      <thead>

        <tr>

          <th>
            DATE / TIME
          </th>

          <th>
            NAME
          </th>

          <th>
            CLASS
          </th>

          <th>
            MODULE
          </th>

          <th>
            SCORE
          </th>

          <th>
            PERCENTAGE
          </th>

        </tr>

      </thead>


      <tbody id="recordBody">

        <tr>

          <td
            colspan="6"
            class="empty"
          >
            Loading student records...
          </td>

        </tr>

      </tbody>

    </table>


  </div>


  <!-- BUTTONS -->

  <div class="actions">

    <button
      class="btn"
      onclick="loadRecords()"
    >
      REFRESH RECORDS
    </button>


    <a
      href="index.html"
      class="btn"
    >
      BACK TO HOME
    </a>

  </div>


</div>


<footer>

  SEQS – Smart English Quiz System

  <br>

  Teacher Dashboard | English Year 3 | 2026

</footer>


<script>


/* ==========================================
   NEW GOOGLE APPS SCRIPT URL
========================================== */


const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzYMS62FFAqgmxOMSSCENvdHvFnjInHB8nHWQoStKsaFbkGrAlPsADr-Od2v8vkrC1L/exec";


let allRecords = [];



/* ==========================================
   LOAD RECORDS
========================================== */


function loadRecords() {


  document
    .getElementById("statusMessage")
    .textContent =
    "Loading student records...";


  fetch(
    GOOGLE_SCRIPT_URL +
    "?t=" +
    new Date().getTime()
  )


  .then(function(response) {


    if (!response.ok) {

      throw new Error(
        "Unable to connect to server."
      );

    }


    return response.json();


  })


  .then(function(data) {


    console.log(
      "SEQS DATA:",
      data
    );


    /* CHECK APPS SCRIPT ERROR */

    if (
      data &&
      data.status === "error"
    ) {

      throw new Error(
        data.message ||
        "Apps Script error."
      );

    }


    /* CHECK DATA FORMAT */

    if (!Array.isArray(data)) {

      throw new Error(
        "Invalid record format."
      );

    }


    allRecords =
      data.slice().reverse();


    displayRecords(
      allRecords
    );


    calculateDashboard(
      allRecords
    );


    document
      .getElementById("statusMessage")
      .textContent =
      "✓ Student records loaded successfully.";


  })


  .catch(function(error) {


    console.error(
      "SEQS Teacher Record Error:",
      error
    );


    document
      .getElementById("statusMessage")
      .textContent =
      "Unable to load student records. Please check the SEQS connection.";


    document
      .getElementById("recordBody")
      .innerHTML =
      `
      <tr>
        <td
          colspan="6"
          class="empty"
        >
          No records could be loaded.
        </td>
      </tr>
      `;


  });


}



/* ==========================================
   DISPLAY RECORDS
========================================== */


function displayRecords(records) {


  const body =
    document
      .getElementById(
        "recordBody"
      );


  body.innerHTML = "";


  /* NO RECORD */

  if (records.length === 0) {


    body.innerHTML =
    `
      <tr>

        <td
          colspan="6"
          class="empty"
        >
          No student records yet.
        </td>

      </tr>
    `;


    return;

  }



  /* DISPLAY EACH RECORD */

  records.forEach(
    function(record) {


      const row =
        document.createElement(
          "tr"
        );


      let date =
        "-";


      if (record.timestamp) {


        const parsedDate =
          new Date(
            record.timestamp
          );


        if (
          !isNaN(
            parsedDate.getTime()
          )
        ) {


          date =
            parsedDate
            .toLocaleString(
              "en-MY",
              {
                timeZone:
                  "Asia/Kuala_Lumpur"
              }
            );


        }


      }



      row.innerHTML =
      `

        <td>
          ${escapeHTML(date)}
        </td>

        <td>
          ${escapeHTML(record.name || "-")}
        </td>

        <td>
          ${escapeHTML(record.studentClass || "-")}
        </td>

        <td>
          ${escapeHTML(record.module || "-")}
        </td>

        <td>
          ${escapeHTML(record.score || "-")}
        </td>

        <td>
          ${escapeHTML(record.percentage || "-")}
        </td>

      `;


      body.appendChild(
        row
      );


    }
  );


}



/* ==========================================
   DASHBOARD CALCULATION
========================================== */


function calculateDashboard(
  records
) {


  const total =
    records.length;


  let sum =
    0;


  let highest =
    0;


  records.forEach(
    function(record) {


      const percentage =
        parseFloat(
          String(
            record.percentage ||
            "0"
          )
          .replace("%", "")
        ) || 0;


      sum +=
        percentage;


      if (
        percentage >
        highest
      ) {


        highest =
          percentage;


      }


    }
  );



  const average =
    total > 0
    ?
    Math.round(
      sum / total
    )
    :
    0;



  document
    .getElementById(
      "totalAttempts"
    )
    .textContent =
    total;



  document
    .getElementById(
      "averageScore"
    )
    .textContent =
    average + "%";



  document
    .getElementById(
      "highestScore"
    )
    .textContent =
    highest + "%";


}



/* ==========================================
   SEARCH / FILTER
========================================== */


function filterRecords() {


  const keyword =
    document
      .getElementById(
        "searchBox"
      )
      .value
      .toLowerCase()
      .trim();



  if (
    keyword === ""
  ) {


    displayRecords(
      allRecords
    );


    return;


  }



  const filtered =
    allRecords.filter(
      function(record) {


        const name =
          String(
            record.name || ""
          )
          .toLowerCase();


        const studentClass =
          String(
            record.studentClass || ""
          )
          .toLowerCase();


        const module =
          String(
            record.module || ""
          )
          .toLowerCase();



        return (

          name.includes(
            keyword
          )

          ||

          studentClass.includes(
            keyword
          )

          ||

          module.includes(
            keyword
          )

        );


      }
    );



  displayRecords(
    filtered
  );


}



/* ==========================================
   SECURITY FOR DISPLAY
========================================== */


function escapeHTML(value) {


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );


}



/* ==========================================
   START
========================================== */


loadRecords();


</script>


</body>

</html>
