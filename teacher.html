<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Rekod Guru</title>

<style>

/* ================================
   FONT & GLOBAL SETTINGS
   Font: Syazalina | Size: 12pt
================================ */

@font-face {
  font-family: 'Syazalina';
  src: local('Syazalina');
}

* {
  box-sizing: border-box;
  font-family: 'Syazalina', Arial, sans-serif !important;
  font-size: 12pt !important;
}

body {
  margin: 0;
  font-family: 'Syazalina', Arial, sans-serif !important;
  font-size: 12pt !important;
  background: linear-gradient(135deg, #e8f3ff, #f7fbff);
  color: #17324d;
  min-height: 100vh;
}


/* ================================
   HEADER
================================ */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 30px 20px;
}

.logo {
  font-weight: bold;
  letter-spacing: 2px;
  margin-bottom: 5px;
}

.subtitle {
  margin-top: 5px;
}

.year {
  margin-top: 10px;
  font-weight: bold;
  color: #d9ecff;
}


/* ================================
   CONTAINER
================================ */

.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}


/* ================================
   WELCOME & TITLES
================================ */

.welcome {
  text-align: center;
  margin-bottom: 25px;
}

.welcome h2 {
  color: #1557a6;
  margin-bottom: 8px;
}

.welcome p {
  color: #607080;
  line-height: 1.5;
}


/* ================================
   CARD & FILTERS
================================ */

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
  margin-bottom: 25px;
}

.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  color: #174a7c;
}

input,
select {
  width: 100%;
  padding: 10px;
  border: 1px solid #cbd8e6;
  border-radius: 10px;
  background: white;
}

input:focus,
select:focus {
  outline: none;
  border-color: #1976d2;
}


/* ================================
   TABLE DESIGN
================================ */

.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  background: white;
}

th, td {
  border: 1px solid #cbd8e6;
  padding: 12px 10px;
  text-align: left;
}

th {
  background-color: #1976d2;
  color: white;
  font-weight: bold;
}

tr:nth-child(even) {
  background-color: #f7fbff;
}

.no-data {
  text-align: center;
  color: #718096;
  padding: 20px;
}


/* ================================
   BUTTONS & ACTIONS
================================ */

.action-btns {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.btn {
  padding: 12px 20px;
  border-radius: 25px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

.btn-back {
  background: white;
  border: 2px solid #1976d2;
  color: #1557a6;
}

.btn-back:hover {
  background: #edf6ff;
}

.btn-print {
  background: #2e7d32;
  color: white;
}

.btn-print:hover {
  background: #1b5e20;
}

.btn-clear {
  background: #c62828;
  color: white;
}

.btn-clear:hover {
  background: #8e0000;
}


/* ================================
   FOOTER
================================ */

footer {
  text-align: center;
  color: #718096;
  padding: 28px 15px;
  line-height: 1.6;
}


/* ================================
   PRINT MEDIA STYLES
================================ */

@media print {
  header, .filter-grid, .action-btns, footer {
    display: none !important;
  }
  .card {
    box-shadow: none;
    padding: 0;
  }
  body {
    background: white;
  }
}

@media (max-width: 650px) {
  .filter-grid {
    grid-template-columns: 1fr;
  }
}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

  <div class="logo">
    SEQS
  </div>

  <div class="subtitle">
    SMART ENGLISH QUIZ SYSTEM
  </div>

  <div class="year">
    👩‍🏫 REKOD KEPUTUSAN GURU
  </div>

</header>


<!-- ================================
     MAIN
================================ -->

<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h2>
      Rekod Pencapaian Murid
    </h2>

    <p>
      Paparan markah dan keputusan kuiz murid bagi Tahun 3 dan Tahun 4.
    </p>

  </div>


  <!-- ================================
        FILTER CARD
  ================================= -->

  <div class="card">

    <div class="filter-grid">

      <!-- CARI NAMA -->
      <div>
        <label for="searchName">CARI NAMA</label>
        <input 
          type="text" 
          id="searchName" 
          placeholder="Taip nama murid..." 
          onkeyup="filterRecords()"
        >
      </div>

      <!-- TAPIS KELAS -->
      <div>
        <label for="filterClass">TAPIS KELAS</label>
        <select id="filterClass" onchange="filterRecords()">
          <option value="">Semua Kelas</option>
          <optgroup label="TAHUN 3">
            <option value="3 ARIF">3 ARIF</option>
            <option value="3 BESTARI">3 BESTARI</option>
            <option value="3 CERDIK">3 CERDIK</option>
            <option value="3 DEDIKASI">3 DEDIKASI</option>
            <option value="3 ELIT">3 ELIT</option>
            <option value="3 FIRDAUS">3 FIRDAUS</option>
            <option value="3 GIGIH">3 GIGIH</option>
            <option value="3 HARMONI">3 HARMONI</option>
            <option value="3 INOVATIF">3 INOVATIF</option>
            <option value="3 JUARA">3 JUARA</option>
            <option value="3 KREATIF">3 KREATIF</option>
          </optgroup>
          <optgroup label="TAHUN 4">
            <option value="4 ARIF">4 ARIF</option>
            <option value="4 BESTARI">4 BESTARI</option>
            <option value="4 CERDIK">4 CERDIK</option>
            <option value="4 DEDIKASI">4 DEDIKASI</option>
            <option value="4 ELIT">4 ELIT</option>
            <option value="4 FIRDAUS">4 FIRDAUS</option>
            <option value="4 GIGIH">4 GIGIH</option>
            <option value="4 HARMONI">4 HARMONI</option>
            <option value="4 INOVATIF">4 INOVATIF</option>
            <option value="4 JUARA">4 JUARA</option>
            <option value="4 KREATIF">4 KREATIF</option>
          </optgroup>
        </select>
      </div>

      <!-- TAPIS TAHUN / MODULE -->
      <div>
        <label for="filterYear">TAPIS TAHUN</label>
        <select id="filterYear" onchange="filterRecords()">
          <option value="">Semua Tahun</option>
          <option value="Year 3">UB Tahun 3</option>
          <option value="Year 4">UB Tahun 4</option>
        </select>
      </div>

    </div>

    <!-- JADUAL REKOD -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 5%;">NO.</th>
            <th style="width: 30%;">NAMA MURID</th>
            <th style="width: 15%;">KELAS</th>
            <th style="width: 30%;">MODUL UB</th>
            <th style="width: 20%;">MARKAH / SKOR</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody">
          <!-- Data dirender melalui JS -->
        </tbody>
      </table>
    </div>

    <!-- BUTANG TINDAKAN -->
    <div class="action-btns">

      <a href="index.html" class="btn btn-back">
        ⬅ KEMBALI KE UTAMA
      </a>

      <div>
        <button class="btn btn-print" onclick="window.print()">
          🖨 CETAK REKOD
        </button>

        <button class="btn btn-clear" onclick="clearRecords()">
          🗑 PADAM SEMUA REKOD
        </button>
      </div>

    </div>

  </div>

</div>


<!-- ================================
     FOOTER
================================ -->

<footer>

  SEQS – Smart English Quiz System

  <br>

  UB Year 3 & UB Year 4 | 2026

</footer>


<!-- ================================
     JAVASCRIPT LOGIC
================================ -->

<script>

/* Memuatkan rekod dari LocalStorage semasa halaman dibuka */
document.addEventListener("DOMContentLoaded", function() {
  loadRecords();
});

let allRecords = [];

function loadRecords() {
  const storedData = localStorage.getItem("seqsTeacherRecords");
  allRecords = storedData ? JSON.parse(storedData) : [];
  renderTable(allRecords);
}

function renderTable(data) {
  const tbody = document.getElementById("recordsTableBody");
  tbody.innerHTML = "";

  if (data.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="no-data">
          Tiada rekod keputusan murid ditemui.
        </td>
      </tr>
    `;
    return;
  }

  data.forEach((item, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td><strong>${item.name}</strong></td>
      <td>${item.studentClass}</td>
      <td>${item.moduleName}</td>
      <td><strong>${item.score}</strong></td>
    `;
    tbody.appendChild(tr);
  });
}

function filterRecords() {
  const searchName = document.getElementById("searchName").value.toLowerCase();
  const filterClass = document.getElementById("filterClass").value;
  const filterYear = document.getElementById("filterYear").value;

  const filtered = allRecords.filter(item => {
    const matchesName = item.name.toLowerCase().includes(searchName);
    const matchesClass = filterClass === "" || item.studentClass === filterClass;
    const matchesYear = filterYear === "" || (item.year && item.year.includes(filterYear));

    return matchesName && matchesClass && matchesYear;
  });

  renderTable(filtered);
}

function clearRecords() {
  if (confirm("Adakah anda pasti ingin memadam semua rekod murid?")) {
    localStorage.removeItem("seqsTeacherRecords");
    allRecords = [];
    renderTable([]);
  }
}

</script>

</body>

</html>
