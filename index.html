<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Smart English Quiz System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e8f3ff, #f7fbff);
  color: #17324d;
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 32px 20px;
}

.logo {
  font-size: 46px;
  font-weight: 800;
  letter-spacing: 3px;
}

.subtitle {
  font-size: 18px;
  margin-top: 5px;
}

.year {
  margin-top: 10px;
  font-weight: bold;
  color: #d9ecff;
}

.container {
  max-width: 720px;
  margin: auto;
  padding: 30px 20px;
}

.welcome {
  text-align: center;
  margin-bottom: 25px;
}

.welcome h2 {
  color: #1557a6;
  margin-bottom: 8px;
}

.welcome p {
  color: #607080;
}

.student-card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  color: #174a7c;
}

input, select {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  border: 1px solid #cbd8e6;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

input:focus, select:focus {
  outline: none;
  border-color: #1976d2;
}

.start-btn {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 30px;
  background: #1976d2;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start-btn:hover {
  background: #0d47a1;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 22px;
}

.menu-btn {
  background: white;
  border: 2px solid #1976d2;
  color: #1557a6;
  padding: 15px 10px;
  border-radius: 15px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.menu-btn:hover {
  background: #edf6ff;
}

footer {
  text-align: center;
  color: #718096;
  padding: 28px 15px;
  font-size: 13px;
}

@media (max-width: 500px) {
  .logo {
    font-size: 38px;
  }

  .menu {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SEQS</div>
  <div class="subtitle">SMART ENGLISH QUIZ SYSTEM</div>
  <div class="year">English Year 3</div>
</header>

<div class="container">

  <div class="welcome">
    <h2>Welcome to SEQS!</h2>
    <p>Enter your information and choose a module to begin.</p>
  </div>

  <div class="student-card">

    <label for="studentName">NAME</label>
    <input
      type="text"
      id="studentName"
      placeholder="Enter your name"
      autocomplete="off"
    >

    <label for="studentClass">CLASS</label>
    <input
      type="text"
      id="studentClass"
      placeholder="Enter your class"
      autocomplete="off"
    >

    <label for="module">MODULE</label>

    <select id="module">
      <option value="">Choose a module</option>

      <option value="module1">
        Module 1
      </option>

      <option value="module2">
        Module 2
      </option>

      <option value="module3">
        Module 3
      </option>

      <option value="module4">
        Module 4
      </option>

      <option value="module5">
        Module 5
      </option>

      <option value="module6">
        Module 6
      </option>

      <option value="module7">
        Module 7
      </option>

      <option value="module8">
        Module 8
      </option>

      <option value="module9">
        Module 9
      </option>

    </select>

    <button class="start-btn" onclick="startQuiz()">
      START QUIZ
    </button>

  </div>


  <div class="menu">

    <button class="menu-btn" onclick="openLeaderboard()">
      🏆 LEADERBOARD
    </button>

    <button class="menu-btn" onclick="openTeacherRecord()">
      👩‍🏫 TEACHER RECORD
    </button>

  </div>

</div>


<footer>
  SEQS – Smart English Quiz System<br>
  English Year 3 | 2026
</footer>


<script>

function startQuiz() {

  const name =
    document.getElementById("studentName").value.trim();

  const studentClass =
    document.getElementById("studentClass").value.trim();

  const module =
    document.getElementById("module").value;


  if (name === "") {
    alert("Please enter your name.");
    return;
  }

  if (studentClass === "") {
    alert("Please enter your class.");
    return;
  }

  if (module === "") {
    alert("Please choose a module.");
    return;
  }


  localStorage.setItem("seqsName", name);
  localStorage.setItem("seqsClass", studentClass);
  localStorage.setItem("seqsModule", module);


  alert(
    "Welcome " + name +
    "!\n\nClass: " + studentClass +
    "\nModule: " + module +
    "\n\nLet's start!"
  );

}


function openLeaderboard() {
  alert("Leaderboard will be available soon!");
}


function openTeacherRecord() {
  alert("Teacher Record will be available soon!");
}

</script>

</body>
</html>
