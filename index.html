<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Smart English Quiz System</title>

<style>

/* ================================
   FONT & GLOBAL SETTINGS
   Font: Arial | Size: 14pt
================================ */

* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 14pt !important;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 14pt !important;
  background: linear-gradient(135deg, #eef5ff 0%, #d8e8ff 100%);
  color: #1a2b4c;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}


/* ================================
   HEADER
================================ */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 35px 20px 25px 20px;
  border-bottom-left-radius: 25px;
  border-bottom-right-radius: 25px;
  box-shadow: 0 6px 20px rgba(13, 71, 161, 0.2);
}

.logo {
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 6px;
}

.subtitle {
  margin-top: 4px;
  opacity: 0.95;
}

.year {
  margin-top: 12px;
  font-weight: bold;
  background: rgba(255, 255, 255, 0.2);
  display: inline-block;
  padding: 6px 18px;
  border-radius: 20px;
  color: #ffffff;
}


/* ================================
   CONTAINER
================================ */

.container {
  max-width: 680px;
  width: 100%;
  margin: auto;
  padding: 25px 20px;
}


/* ================================
   WELCOME
================================ */

.welcome {
  text-align: center;
  margin-bottom: 22px;
}

.welcome h2 {
  color: #0d47a1;
  margin-bottom: 6px;
  font-weight: bold;
}

.welcome p {
  color: #50647b;
  line-height: 1.5;
  margin: 0;
}


/* ================================
   STUDENT CARD
================================ */

.student-card {
  background: #ffffff;
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(25, 118, 210, 0.12);
  border: 1px solid rgba(203, 216, 230, 0.5);
}


/* ================================
   FORM CONTROLS
================================ */

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
  color: #0d47a1;
}

input,
select {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #cbd8e6;
  border-radius: 12px;
  background-color: #fbfdff;
  color: #1a2b4c;
  transition: all 0.25s ease;
  outline: none;
}

input:hover,
select:hover {
  border-color: #90caf9;
  background-color: #ffffff;
}

input:focus,
select:focus {
  border-color: #1976d2;
  background-color: #ffffff;
  box-shadow: 0 0 0 4px rgba(25, 118, 210, 0.15);
}


/* ================================
   INTERACTIVE START BUTTON
================================ */

.start-btn {
  width: 100%;
  border: none;
  padding: 16px;
  border-radius: 30px;
  background: linear-gradient(135deg, #1976d2, #0d47a1);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(25, 118, 210, 0.35);
  transition: all 0.25s ease;
  margin-top: 10px;
}

.start-btn:hover {
  background: linear-gradient(135deg, #1565c0, #0a3880);
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(25, 118, 210, 0.45);
}

.start-btn:active {
  transform: translateY(1px);
  box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
}


/* ================================
   BOTTOM MENU (REKOD GURU)
================================ */

.menu {
  margin-top: 22px;
}

.menu-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  background: #ffffff;
  border: 2px solid #1976d2;
  color: #1557a6;
  padding: 12px 20px;
  border-radius: 18px;
  font-weight: bold;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
  transition: all 0.25s ease;
}

.menu-btn:hover {
  background: #1976d2;
  color: #ffffff;
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(25, 118, 210, 0.25);
}

.menu-btn:active {
  transform: translateY(0);
}


/* ================================
   FOOTER
================================ */

footer {
  text-align: center;
  color: #607080;
  padding: 24px 15px;
  line-height: 1.6;
}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

  <div class="logo">
    SEQS
  </div>

  <div class="subtitle">
    SMART ENGLISH QUIZ SYSTEM
  </div>

  <div class="year">
    UB Year 3 & UB Year 4
  </div>

</header>


<!-- ================================
     MAIN
================================ -->

<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h2>
      Welcome to SEQS!
    </h2>

    <p>
      Enter your details and select a module to start your quiz.
    </p>

  </div>


  <!-- ================================
        STUDENT INFORMATION FORM
  ================================= -->

  <div class="student-card">


    <!-- 1. NAMA PENUH -->

    <div class="form-group">
      <label for="studentName">
        NAMA PENUH
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Masukkan nama penuh anda"
        autocomplete="off"
      >
    </div>


    <!-- 2. PILIHAN KELAS -->

    <div class="form-group">
      <label for="studentClass">
        PILIHAN KELAS
      </label>

      <select id="studentClass">

        <option value="">Pilih Kelas</option>

        <optgroup label="TAHUN 3">
          <option value="3 ARIF">3 ARIF</option>
          <option value="3 BESTARI">3 BESTARI</option>
          <option value="3 CERDIK">3 CERDIK</option>
          <option value="3 DEDIKASI">3 DEDIKASI</option>
          <option value="3 ELIT">3 ELIT</option>
          <option value="3 FIRDAUS">3 FIRDAUS</option>
          <option value="3 GIGIH">3 GIGIH</option>
          <option value="3 HARMONI">3 HARMONI</option>
          <option value="3 INOVATIF">3 INOVATIF</option>
          <option value="3 JUARA">3 JUARA</option>
          <option value="3 KREATIF">3 KREATIF</option>
        </optgroup>

        <optgroup label="TAHUN 4">
          <option value="4 ARIF">4 ARIF</option>
          <option value="4 BESTARI">4 BESTARI</option>
          <option value="4 CERDIK">4 CERDIK</option>
          <option value="4 DEDIKASI">4 DEDIKASI</option>
          <option value="4 ELIT">4 ELIT</option>
          <option value="4 FIRDAUS">4 FIRDAUS</option>
          <option value="4 GIGIH">4 GIGIH</option>
          <option value="4 HARMONI">4 HARMONI</option>
          <option value="4 INOVATIF">4 INOVATIF</option>
          <option value="4 JUARA">4 JUARA</option>
          <option value="4 KREATIF">4 KREATIF</option>
        </optgroup>

      </select>
    </div>


    <!-- 3. MODULE UB TAHUN 3 -->

    <div class="form-group">
      <label for="moduleY3">
        MODULE UB TAHUN 3
      </label>

      <select id="moduleY3" onchange="handleModuleSelect('y3')">

        <option value="">Pilih Module UB Tahun 3</option>
        <option value="module1">Module 1 – Welcome!</option>
        <option value="module2">Module 2 – Every Day</option>
        <option value="module3">Module 3 – Right Now</option>
        <option value="module4">Module 4 – Year In, Year Out</option>
        <option value="module5">Module 5 – My New House</option>
        <option value="module6">Module 6 – Food, Please!</option>
        <option value="module7">Module 7 – Out and About</option>
        <option value="module8">Module 8 – Where Were You Yesterday?</option>
        <option value="module9">Module 9 – On Holiday</option>
        <option value="module10">Module 10 – The World Around Us</option>

      </select>
    </div>


    <!-- 4. MODULE UB TAHUN 4 -->

    <div class="form-group">
      <label for="moduleY4">
        MODULE UB TAHUN 4
      </label>

      <select id="moduleY4" onchange="handleModuleSelect('y4')">

        <option value="">Pilih Module UB Tahun 4</option>
        <option value="module1">Module 1 – Where Are You From?</option>
        <option value="module2">Module 2 – My Week</option>
        <option value="module3">Module 3 – In The Past</option>
        <option value="module4">Module 4 – Celebrations</option>
        <option value="module5">Module 5 – Eating Right</option>
        <option value="module6">Module 6 – Getting Around</option>
        <option value="module7">Module 7 – Helping Out</option>
        <option value="module8">Module 8 – Amazing Animals</option>
        <option value="module9">Module 9 – Get Active!</option>
        <option value="module10">Module 10 – What's The Matter?</option>

      </select>
    </div>


    <!-- START QUIZ BUTTON -->

    <button
      type="button"
      class="start-btn"
      onclick="startQuiz()"
    >
      START QUIZ
    </button>

  </div>


  <!-- ================================
        MENU (REKOD GURU)
  ================================= -->

  <div class="menu">

    <!-- REKOD GURU -->

    <a
      href="teacher.html"
      class="menu-btn"
    >
      👩‍🏫 REKOD GURU
    </a>

  </div>

</div>


<!-- ================================
     FOOTER
================================ -->

<footer>

  SEQS – Smart English Quiz System

  <br>

  UB Year 3 & UB Year 4 | 2026

</footer>


<!-- ================================
     JAVASCRIPT LOGIC
================================ -->

<script>

/* Reset modul bertentangan jika salah satu dipilih */
function handleModuleSelect(selectedYear) {
  if (selectedYear === 'y3') {
    document.getElementById("moduleY4").value = "";
  } else if (selectedYear === 'y4') {
    document.getElementById("moduleY3").value = "";
  }
}

function startQuiz() {

  const name = document.getElementById("studentName").value.trim();
  const studentClass = document.getElementById("studentClass").value;
  const modY3 = document.getElementById("moduleY3");
  const modY4 = document.getElementById("moduleY4");

  let selectedYear = "";
  let selectedModuleCode = "";
  let selectedModuleName = "";

  if (modY3.value !== "") {
    selectedYear = "y3";
    selectedModuleCode = modY3.value;
    selectedModuleName = "UB TAHUN 3: " + modY3.options[modY3.selectedIndex].text;
  } else if (modY4.value !== "") {
    selectedYear = "y4";
    selectedModuleCode = modY4.value;
    selectedModuleName = "UB TAHUN 4: " + modY4.options[modY4.selectedIndex].text;
  }

  /* Validation Checks */
  if (name === "") {
    alert("Sila masukkan NAMA PENUH anda.");
    document.getElementById("studentName").focus();
    return;
  }

  if (studentClass === "") {
    alert("Sila pilih KELAS anda.");
    document.getElementById("studentClass").focus();
    return;
  }

  if (selectedYear === "") {
    alert("Sila pilih satu modul daripada MODULE UB TAHUN 3 atau MODULE UB TAHUN 4.");
    return;
  }

  /* Simpan Maklumat Murid ke LocalStorage */
  localStorage.setItem("seqsName", name);
  localStorage.setItem("seqsClass", studentClass);
  localStorage.setItem("seqsYear", selectedYear === "y3" ? "Year 3" : "Year 4");
  localStorage.setItem("seqsModule", selectedModuleCode);
  localStorage.setItem("seqsModuleName", selectedModuleName);

  /* Buka Muka Surat Soalan Kuiz (Contoh: y3_module1.html / y4_module1.html) */
  window.location.href = selectedYear + "_" + selectedModuleCode + ".html";

}

</script>

</body>

</html>
