<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SEQS | Smart English Quiz System</title>

<style>

/* ================================
   GENERAL
================================ */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #e8f3ff, #f7fbff);
  color: #17324d;
  min-height: 100vh;
}


/* ================================
   HEADER
================================ */

header {
  background: linear-gradient(135deg, #0d47a1, #1976d2);
  color: white;
  text-align: center;
  padding: 35px 20px;
}

.logo {
  font-size: 50px;
  font-weight: 800;
  letter-spacing: 4px;
}

.subtitle {
  font-size: 18px;
  margin-top: 5px;
}

.year {
  margin-top: 10px;
  font-weight: bold;
  color: #d9ecff;
}


/* ================================
   CONTAINER
================================ */

.container {
  max-width: 720px;
  margin: auto;
  padding: 30px 20px;
}


/* ================================
   WELCOME
================================ */

.welcome {
  text-align: center;
  margin-bottom: 25px;
}

.welcome h2 {
  color: #1557a6;
  margin-bottom: 8px;
}

.welcome p {
  color: #607080;
  line-height: 1.5;
}


/* ================================
   STUDENT CARD
================================ */

.student-card {
  background: white;
  padding: 28px;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.10);
}


/* ================================
   FORM
================================ */

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
  color: #174a7c;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-bottom: 20px;
  border: 1px solid #cbd8e6;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

input:focus,
select:focus {
  outline: none;
  border-color: #1976d2;
}


/* ================================
   START QUIZ
================================ */

.start-btn {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 30px;
  background: #1976d2;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.start-btn:hover {
  background: #0d47a1;
}


/* ================================
   BOTTOM MENU
================================ */

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-top: 22px;
}

.menu-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 58px;

  background: white;
  border: 2px solid #1976d2;
  color: #1557a6;

  padding: 15px 10px;
  border-radius: 15px;

  font-weight: bold;
  font-size: 15px;

  text-decoration: none;
  cursor: pointer;

  transition: 0.2s;
}

.menu-btn:hover {
  background: #edf6ff;
  transform: translateY(-2px);
}


/* ================================
   FOOTER
================================ */

footer {
  text-align: center;
  color: #718096;
  padding: 28px 15px;
  font-size: 13px;
  line-height: 1.6;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 500px) {

  .logo {
    font-size: 38px;
  }

  .menu {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header>

  <div class="logo">
    SEQS
  </div>

  <div class="subtitle">
    SMART ENGLISH QUIZ SYSTEM
  </div>

  <div class="year">
    English Year 3
  </div>

</header>


<!-- ================================
     MAIN
================================ -->

<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h2>
      Welcome to SEQS!
    </h2>

    <p>
      Enter your name and class,
      then choose a module to begin.
    </p>

  </div>


  <!-- ================================
       STUDENT INFORMATION
  ================================= -->

  <div class="student-card">


    <!-- NAME -->

    <label for="studentName">
      NAME
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Enter your name"
      autocomplete="off"
    >


    <!-- CLASS -->

    <label for="studentClass">
      CLASS
    </label>

    <input
      type="text"
      id="studentClass"
      placeholder="Enter your class"
      autocomplete="off"
    >


    <!-- MODULE -->

    <label for="module">
      MODULE
    </label>

    <select id="module">

      <option value="">
        Choose a module
      </option>

      <option value="module1">
        Module 1 – Welcome!
      </option>

      <option value="module2">
        Module 2 – Every Day
      </option>

      <option value="module3">
        Module 3 – Right Now
      </option>

      <option value="module4">
        Module 4 – Year In, Year Out
      </option>

      <option value="module5">
        Module 5 – My New House
      </option>

      <option value="module6">
        Module 6 – Food, Please!
      </option>

      <option value="module7">
        Module 7 – Out and About
      </option>

      <option value="module8">
        Module 8 – Where Were You Yesterday?
      </option>

      <option value="module9">
        Module 9 – On Holiday
      </option>

      <option value="module10">
        Module 10 – The World Around Us
      </option>

    </select>


    <!-- START QUIZ -->

    <button
      type="button"
      class="start-btn"
      onclick="startQuiz()"
    >
      START QUIZ
    </button>

  </div>


  <!-- ================================
       MENU
  ================================= -->

  <div class="menu">


    <!-- LEADERBOARD -->

    <a
      href="leaderboard.html"
      class="menu-btn"
    >
      🏆 LEADERBOARD
    </a>


    <!-- TEACHER RECORD -->

    <a
      href="teacher.html"
      class="menu-btn"
    >
      👩‍🏫 TEACHER RECORD
    </a>


  </div>

</div>


<!-- ================================
     FOOTER
================================ -->

<footer>

  SEQS – Smart English Quiz System

  <br>

  English Year 3 | 2026

</footer>


<!-- ================================
     JAVASCRIPT
================================ -->

<script>


/* ================================
   START QUIZ
================================ */

function startQuiz() {


  const name =
    document
      .getElementById("studentName")
      .value
      .trim();


  const studentClass =
    document
      .getElementById("studentClass")
      .value
      .trim();


  const moduleSelect =
    document
      .getElementById("module");


  const module =
    moduleSelect.value;


  const moduleText =
    moduleSelect
      .options[moduleSelect.selectedIndex]
      .text;


  /* ================================
     VALIDATION
  ================================= */

  if (name === "") {

    alert(
      "Please enter your name."
    );

    document
      .getElementById("studentName")
      .focus();

    return;
  }


  if (studentClass === "") {

    alert(
      "Please enter your class."
    );

    document
      .getElementById("studentClass")
      .focus();

    return;
  }


  if (module === "") {

    alert(
      "Please choose a module."
    );

    document
      .getElementById("module")
      .focus();

    return;
  }


  /* ================================
     SAVE STUDENT INFORMATION
  ================================= */

  localStorage.setItem(
    "seqsName",
    name
  );


  localStorage.setItem(
    "seqsClass",
    studentClass
  );


  localStorage.setItem(
    "seqsModule",
    module
  );


  localStorage.setItem(
    "seqsModuleName",
    moduleText
  );


  /* ================================
     OPEN QUIZ
  ================================= */

  window.location.href =
    module + ".html";

}


</script>


</body>

</html>
